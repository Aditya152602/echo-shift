<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05010f"/><stop offset="1" stop-color="#1a0638"/></linearGradient>
    <linearGradient id="ttl" x1="0" x2="1"><stop offset="0" stop-color="#00f0ff"/><stop offset=".5" stop-color="#b44dff"/><stop offset="1" stop-color="#ff3d9a"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="5s" repeatCount="indefinite"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="floor"><rect x="0" y="215" width="900" height="165"/></clipPath>
  </defs>
  <rect width="900" height="380" fill="url(#bg)"/>
  <g fill="#fff" opacity=".7"><circle cx="80" cy="40" r="1.5"><animate attributeName="opacity" values=".1;1;.1" dur="3s" repeatCount="indefinite"/></circle><circle cx="780" cy="60" r="1.5"><animate attributeName="opacity" values="1;.1;1" dur="2.5s" repeatCount="indefinite"/></circle><circle cx="300" cy="25" r="1"><animate attributeName="opacity" values=".1;1;.1" dur="4s" repeatCount="indefinite"/></circle><circle cx="640" cy="30" r="1"><animate attributeName="opacity" values="1;.2;1" dur="3.5s" repeatCount="indefinite"/></circle></g>
  <!-- perspective floor -->
  <g clip-path="url(#floor)" stroke="#8a2bff" stroke-width="1" opacity=".55">
    <g id="rays"><line x1="450" y1="215" x2="-400" y2="380"/><line x1="450" y1="215" x2="-100" y2="380"/><line x1="450" y1="215" x2="150" y2="380"/><line x1="450" y1="215" x2="300" y2="380"/><line x1="450" y1="215" x2="450" y2="380"/><line x1="450" y1="215" x2="600" y2="380"/><line x1="450" y1="215" x2="750" y2="380"/><line x1="450" y1="215" x2="1000" y2="380"/><line x1="450" y1="215" x2="1300" y2="380"/></g>
    <line x1="0" y1="225" x2="900" y2="225"/><line x1="0" y1="242" x2="900" y2="242"/><line x1="0" y1="265" x2="900" y2="265"/><line x1="0" y1="298" x2="900" y2="298"/><line x1="0" y1="345" x2="900" y2="345"/>
    <rect x="0" y="215" width="900" height="3" fill="#00f0ff" stroke="none"><animate attributeName="y" values="215;380" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0" dur="3s" repeatCount="indefinite"/></rect>
  </g>
  <!-- orbit rings -->
  <ellipse cx="450" cy="170" rx="210" ry="48" fill="none" stroke="#00f0ff" stroke-opacity=".35" stroke-dasharray="4 8"><animate attributeName="stroke-dashoffset" values="0;-48" dur="3s" repeatCount="indefinite"/></ellipse>
  <ellipse cx="450" cy="170" rx="150" ry="30" fill="none" stroke="#ff3d9a" stroke-opacity=".35" stroke-dasharray="2 6"><animate attributeName="stroke-dashoffset" values="0;32" dur="2s" repeatCount="indefinite"/></ellipse>
  <!-- floating cube -->
  <g transform="translate(450 150)" filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="450 142;450 162;450 142" dur="3.2s" repeatCount="indefinite" additive="replace"/>
    <polygon points="0,-62 54,-31 0,0 -54,-31" fill="#00f0ff"><animate attributeName="fill" values="#00f0ff;#b44dff;#00f0ff" dur="4s" repeatCount="indefinite"/></polygon>
    <polygon points="-54,-31 0,0 0,62 -54,31" fill="#5b1bb5"><animate attributeName="fill" values="#5b1bb5;#c2186f;#5b1bb5" dur="4s" repeatCount="indefinite"/></polygon>
    <polygon points="0,0 54,-31 54,31 0,62" fill="#2a0a66"><animate attributeName="fill" values="#2a0a66;#0a6a8a;#2a0a66" dur="4s" repeatCount="indefinite"/></polygon>
    <text x="-27" y="20" font-size="30" fill="#fff" font-family="Arial" text-anchor="middle" transform="skewY(30)">◆</text>
    <text x="27" y="12" font-size="30" fill="#fff" font-family="Arial" text-anchor="middle" transform="skewY(-30)">▲</text>
    <polygon points="0,-62 54,-31 0,0 -54,-31" fill="none" stroke="#fff" stroke-opacity=".8"/>
  </g>
  <!-- orbiting symbols -->
  <g font-family="Arial" font-size="26" filter="url(#glow)">
    <text fill="#00f0ff">●<animateMotion dur="7s" repeatCount="indefinite" path="M450,122 a210,48 0 1,1 -0.1,0"/></text>
    <text fill="#ff3d9a">■<animateMotion dur="7s" begin="-2.3s" repeatCount="indefinite" path="M450,122 a210,48 0 1,1 -0.1,0"/></text>
    <text fill="#ffe14d">▲<animateMotion dur="7s" begin="-4.6s" repeatCount="indefinite" path="M450,122 a210,48 0 1,1 -0.1,0"/></text>
    <text fill="#7dff8a">★<animateMotion dur="5s" repeatCount="indefinite" path="M450,140 a150,30 0 1,0 -0.1,0"/></text>
  </g>
  <!-- title with 3D extrusion -->
  <g font-family="Impact, 'Arial Black', sans-serif" font-size="74" text-anchor="middle" letter-spacing="10">
    <text x="456" y="342" fill="#2a0a66">ECHO SHIFT</text><text x="454" y="340" fill="#4a14a0">ECHO SHIFT</text>
    <text x="450" y="336" fill="url(#ttl)" filter="url(#glow)">ECHO SHIFT</text>
  </g>
  <text x="450" y="366" font-family="monospace" font-size="14" fill="#9fb4ff" text-anchor="middle" letter-spacing="6">MEMORIZE · CHOOSE · SHIELD · PULSE · WIN<animate attributeName="opacity" values=".5;1;.5" dur="2s" repeatCount="indefinite"/></text>
</svg>