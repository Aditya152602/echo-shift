<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="900" height="200" rx="16" fill="#0b0620"/>
  <text x="450" y="30" fill="#9fb4ff" font-size="14" text-anchor="middle" letter-spacing="4">ONE ROUND · 22 SECONDS</text>
  <!-- memorize block (7s) -->
  <g>
    <polygon points="60,90 80,75 330,75 310,90" fill="#00f0ff"/><polygon points="60,90 310,90 310,130 60,130" fill="#0891a6"/><polygon points="310,90 330,75 330,115 310,130" fill="#056273"/>
    <text x="185" y="116" fill="#fff" font-size="18" font-weight="bold" text-anchor="middle">MEMORIZE · 7s</text>
  </g>
  <!-- answer block (15s) -->
  <g>
    <polygon points="350,90 370,75 800,75 780,90" fill="#ff3d9a"/><polygon points="350,90 780,90 780,130 350,130" fill="#b3216d"/><polygon points="780,90 800,75 800,115 780,130" fill="#7a1048"/>
    <text x="565" y="116" fill="#fff" font-size="18" font-weight="bold" text-anchor="middle">ANSWER · 15s</text>
  </g>
  <!-- progress runner -->
  <rect x="60" y="150" width="740" height="6" rx="3" fill="#2a1f55"/>
  <rect x="60" y="150" width="740" height="6" rx="3" fill="#b44dff" filter="url(#g)"><animate attributeName="width" values="0;740" dur="6s" repeatCount="indefinite"/></rect>
  <circle cy="153" r="7" fill="#fff" filter="url(#g)"><animate attributeName="cx" values="60;800" dur="6s" repeatCount="indefinite"/></circle>
  <text x="60" y="180" fill="#8d86b8" font-size="12">sequence flashes</text><text x="800" y="180" fill="#8d86b8" font-size="12" text-anchor="end">pick the final symbol → score + energy</text>
</svg>